# Disable data.sql seeding for integration tests, keeping the database clean and empty.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update

# Dummy secrets for test profile to satisfy @Value injections
jwt.secret=DummyTestSecretKeyForJwtAuthenticationThatIsLongEnough
jwt.expiration=86400000
ecpay.merchant-id=dummyMerchantId
ecpay.hash-key=dummyHashKey
ecpay.hash-iv=dummyHashIv
ecpay.payment-action-url=http://dummy-url.com
ecpay.backend-url=http://localhost:8080
spring.mail.host=localhost
spring.mail.port=587
spring.mail.password=dummyMailPassword
spring.mail.username=dummy@gmail.com
openrouter.api.key=dummyApiKey
cors.allowed-origin=http://localhost:5173
