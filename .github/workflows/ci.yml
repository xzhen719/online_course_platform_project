name: Full Stack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Backend unit + integration tests
  # Skips if only frontend files changed
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for backend changes
      id: backend-changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          backend:
            - 'backend/**'

    - name: Set up JDK 21
      if: steps.backend-changes.outputs.backend == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests with JaCoCo Coverage
      id: run-tests
      if: steps.backend-changes.outputs.backend == 'true'
      working-directory: ./backend
      run: |
        chmod +x mvnw
        ./mvnw test -Dtest="!*ApplicationTests"

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      if: steps.run-tests.outcome == 'success' || steps.run-tests.outcome == 'failure'
      with:
        name: jacoco-coverage-report
        path: backend/target/site/jacoco/
        retention-days: 14

  # Job 2: E2E browser tests (heavy)
  # Only runs on Pull Requests — not on push to main (already validated)
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Start Full Stack with Docker Compose
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: docker compose up -d --build

      - name: Wait for Backend Setup
        run: |
          echo "Waiting for backend to start..."
          timeout 120 bash -c 'while ! curl -s http://localhost:8080/v3/api-docs > /dev/null; do sleep 5; done'
          echo "Backend is ready!"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
