name: Full Stack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests with JaCoCo Coverage
      working-directory: ./backend
      run: |
        chmod +x mvnw
        ./mvnw test -Dtest="!*ApplicationTests"

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      if: always() # Upload report even if some tests fail
      with:
        name: jacoco-coverage-report
        path: backend/target/site/jacoco/
        retention-days: 14

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Start Full Stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for Backend Setup
        run: |
          echo "Waiting for backend to start..."
          # Simple polling loop to check if backend is up (using swagger docs endpoint)
          timeout 120 bash -c 'while ! curl -s http://localhost:8080/v3/api-docs > /dev/null; do sleep 5; done'
          echo "Backend is ready!"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
